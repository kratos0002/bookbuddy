[build]
  base = "."
  publish = "client/dist"
  command = "./scripts/direct-build.sh"

[build.environment]
  NODE_VERSION = "18.18.0"
  NPM_FLAGS = "--legacy-peer-deps --ignore-engines --no-optional"
  DEBUG = "true"
  VITE_API_URL = "https://bookbuddy-qpi.onrender.com"

# Set up redirects for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200 