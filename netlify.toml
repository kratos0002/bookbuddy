[build]
  base = "."
  publish = "client/dist"
  command = "./scripts/direct-build.sh"

[build.environment]
  NODE_VERSION = "18.18.0"
  NPM_FLAGS = "--legacy-peer-deps --no-audit --loglevel verbose --ignore-engines"
  DEBUG = "true"

# Set up redirects for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200 